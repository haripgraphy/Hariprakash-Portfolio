<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#070707" />
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0323a" />
      <stop offset="100%" stop-color="#a81219" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a0004" />
      <stop offset="100%" stop-color="#4a0002" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9e0e14" />
      <stop offset="100%" stop-color="#600003" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad3)" />
  <rect x="20" y="20" width="472" height="472" rx="98" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8" />

  <!-- 3D Isometric Cube / Spatial Coordinate Block -->
  <!-- Center: 256, 256 -->
  <!-- Top Face -->
  <polygon points="256,128 376,198 256,268 136,198" fill="url(#topFace)" />
  <!-- Left Face -->
  <polygon points="136,198 256,268 256,408 136,338" fill="url(#leftFace)" />
  <!-- Right Face -->
  <polygon points="256,268 376,198 376,338 256,408" fill="url(#rightFace)" />

  <!-- Crisp Wireframe Outlines & Center Spark -->
  <polyline points="136,198 256,268 376,198" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.45" />
  <line x1="256" y1="268" x2="256" y2="408" stroke="#ffffff" stroke-width="6" opacity="0.45" />

  <!-- Center Floating Node / Vertex Point -->
  <circle cx="256" cy="268" r="10" fill="#FFFFFF" />
</svg>